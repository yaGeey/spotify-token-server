services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DB_PATH: /data/playlists.db
    volumes:
      - spotify-data:/data
    container_name: spotify
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "3"

volumes:
  spotify-data:
